spring:
  application:
    name: pdf-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/pdf_platform
    username: pdf_user
    password: pdf_password
  jpa:
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
app:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin123}
    bucket: ${S3_BUCKET:pdf-files}
  processor:
    base-url: ${PROCESSOR_BASE_URL:http://localhost:8000}
  dispatcher:
    pool-size: 4
  jobs:
    retention-hours: 1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
