services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdf_platform
      POSTGRES_USER: ${POSTGRES_USER:-pdf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes images; Chainguard builds the same server from source.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-dev-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  createbucket:
    # The -dev variant has the shell the loop below needs.
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
    command: >-
      "until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-local-dev-minio-secret};
      do sleep 1; done;
      mc mb -p local/pdf-files || true;
      exit 0"

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER:-pdf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      S3_ENDPOINT: http://minio:9000
      # Deliberately not http://minio:9000 - this one signs URLs a browser on the host follows
      # directly, and the host resolves MinIO through its published port, not the compose
      # network's internal service name.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-minio-secret}
      S3_BUCKET: pdf-files
      PROCESSOR_BASE_URL: http://processor:8000
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN:-local-dev-processor-token}
      OPENAPI_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      processor:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  processor:
    build:
      context: .
      dockerfile: processor.Dockerfile
    environment:
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN:-local-dev-processor-token}
    ports:
      - "127.0.0.1:8000:8000"
    tmpfs:
      - /workspace:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time - Next.js inlines NEXT_PUBLIC_* during `next build`.
        NEXT_PUBLIC_PARENT_URL: ${NEXT_PUBLIC_PARENT_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8091
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
