services:
  image-tools:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3021:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
      IMAGE_WORKER_URL: http://image-worker:8094
    depends_on:
      image-worker:
        condition: service_healthy
    mem_limit: 768m
    cpus: "1.50"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  image-worker:
    build: ./image-worker
    restart: unless-stopped
    expose:
      - "8094"
    environment:
      OCR_LANG: eng
      MODEL_DIR: /models
    mem_limit: 768m
    cpus: "1.00"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
