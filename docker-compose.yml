services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdf_platform
      POSTGRES_USER: pdf_user
      POSTGRES_PASSWORD: pdf_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
    command: >-
      "until mc alias set local http://minio:9000 minioadmin minioadmin123;
      do sleep 1; done;
      mc mb -p local/pdf-files || true;
      exit 0"

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      S3_ENDPOINT: http://minio:9000
      # Deliberately not http://minio:9000 - this one signs URLs a browser on the host follows
      # directly, and the host resolves MinIO through its published port, not the compose
      # network's internal service name.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: pdf-files
      PROCESSOR_BASE_URL: http://processor:8000
    ports:
      - "8091:8080"
    depends_on:
      - postgres
      - redis
      - minio
      - createbucket
      - processor

  processor:
    build:
      context: .
      dockerfile: processor.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - processor_workspace:/workspace

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8091
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  processor_workspace: