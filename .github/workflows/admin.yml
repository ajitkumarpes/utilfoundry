name: Admin

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/admin
    services:
      # Disposable: the integration and browser suites both wipe it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: admin_ci
          POSTGRES_USER: admin_user
          POSTGRES_PASSWORD: admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_user -d admin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://admin_user:admin_password@127.0.0.1:5432/admin_ci
      E2E_DATABASE_URL: postgres://admin_user:admin_password@127.0.0.1:5432/admin_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests, plus the database suite against the Postgres service above.
      - run: npm test
      # Deliberately no DATABASE_URL or secrets: the build must not need them (the Docker
      # image is built the same way).
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-e2e-traces
          path: apps/admin/test-results
          retention-days: 7
