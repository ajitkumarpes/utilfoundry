name: Image tools

on:
  pull_request:
    paths:
      - "apps/images/**"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    paths:
      - "apps/images/**"
      - ".github/workflows/images.yml"

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/images/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The OCR, background-removal and upscaling tools call the Python worker; with one
      # running, the browser suite exercises those four end to end as well.
      - name: Start the image worker
        run: |
          docker build -t image-worker image-worker
          docker run -d --name image-worker -p 127.0.0.1:8094:8094 image-worker
          for attempt in $(seq 1 60); do curl -sf http://127.0.0.1:8094/health && exit 0; sleep 2; done
          docker logs image-worker; exit 1
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
          E2E_IMAGE_WORKER: "1"
          IMAGE_WORKER_URL: http://127.0.0.1:8094
      # Without this a browser failure leaves nothing to look at afterwards: the log has the
      # assertion, but not the trace, the screenshot or the page that produced it.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: images-playwright-report
          path: |
            apps/images/playwright-report
            apps/images/test-results
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/images/image-worker
    steps:
      - uses: actions/checkout@v4
      # The tests run inside the production image: they need Tesseract, OpenCV and the two
      # models it downloads (checksum-verified by the build), exactly as deployed.
      - run: docker build -t image-worker .
      - run: >-
          docker run --rm --user root -v "$PWD/test_app.py:/app/test_app.py:ro" image-worker
          sh -c "pip install --quiet --disable-pip-version-check httpx==0.28.1 && cd /app && python -m unittest -v test_app.py"
