name: Developer tools

on:
  pull_request:
    paths:
      - "apps/developer/**"
      - ".github/workflows/developer.yml"
  push:
    branches: [main]
    paths:
      - "apps/developer/**"
      - ".github/workflows/developer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/developer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
          E2E_ALL_BROWSERS: "1"
      # Without this a browser failure leaves nothing to look at afterwards: the log has the
      # assertion, but not the trace, the screenshot or the page that produced it. A flake in
      # this suite went undiagnosable for exactly that reason.
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: developer-playwright-report
          path: |
            apps/developer/playwright-report
            apps/developer/test-results
          retention-days: 7
