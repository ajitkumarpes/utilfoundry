name: Deployment config

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compose file resolves with the example environment
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
      # A valid file can still name an image that is gone: MinIO stopped publishing its images,
      # and nothing noticed until a pull failed. Every image the stack pulls (rather than
      # builds) must still resolve in its registry.
      - name: Every pulled image still exists
        run: |
          images=$(docker compose -f deploy/docker-compose.yml config --format json \
            | jq -r '.services[] | select(.build == null) | .image' | sort -u)
          status=0
          for image in $images; do
            if docker manifest inspect "$image" > /dev/null; then
              echo "ok      $image"
            else
              echo "missing $image"; status=1
            fi
          done
          exit $status
      - name: Caddyfile is valid
        run: |
          docker run --rm -e ROOT_DOMAIN=example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
