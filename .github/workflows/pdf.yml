name: PDF platform

on:
  pull_request:
    paths:
      - "apps/pdf/**"
      - ".github/workflows/pdf.yml"
  push:
    branches: [main]
    paths:
      - "apps/pdf/**"
      - ".github/workflows/pdf.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pdf/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pdf/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      # Coverage, not plain test: the thresholds in vitest.config.mts only bite when CI runs them.
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
      # Without this a browser failure leaves nothing to look at afterwards: the log has the
      # assertion, but not the trace, the screenshot or the page that produced it.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-playwright-report
          path: |
            apps/pdf/frontend/playwright-report
            apps/pdf/frontend/test-results
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pdf/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  processor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pdf/processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/pdf/processor/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_app.py
